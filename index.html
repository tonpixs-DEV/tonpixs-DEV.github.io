<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<meta name="theme-color" content="#0f1a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>นับแต้มพิกเคิลบอล</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1a14;--card:#1a2a21;--a:#2f9e6b;--b:#e08a2e;--t:#f1f5f2;--m:#8fa597;--w:#ffd84d}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;user-select:none}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.call{text-align:center;padding:8px 0 10px;position:relative}
.lang{position:absolute;right:0;top:8px;background:var(--card);color:var(--t);border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.call small{color:var(--m);font-size:13px;display:block}
.call b{font-size:34px;letter-spacing:4px;font-variant-numeric:tabular-nums}
.teams{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.team{border:0;border-radius:20px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;font-family:inherit;cursor:pointer;padding:8px}
.team.a{background:var(--a)}.team.b{background:var(--b)}
.team:active{transform:scale(.98)}
.team input{background:rgba(0,0,0,.2);border:0;color:#fff;text-align:center;font-size:16px;font-weight:600;border-radius:10px;padding:6px;width:90%;font-family:inherit}
.score{font-size:clamp(80px,26vw,130px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hint{font-size:12px;opacity:.85}
.srv{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:center;min-height:26px}
.badge{background:var(--w);color:#222;border-radius:999px;font-size:13px;font-weight:700;padding:3px 10px}
.games{font-size:13px;opacity:.9}
.fault{margin-top:10px;background:#c0392b;color:#fff;border:0;border-radius:14px;padding:16px;font-size:20px;font-weight:700;font-family:inherit;cursor:pointer}.fault:active{opacity:.8}
.bar{display:flex;gap:8px;margin-top:10px}
.bar button{flex:1;background:var(--card);color:var(--t);border:0;border-radius:14px;padding:14px 4px;font-size:15px;font-family:inherit;cursor:pointer}
.bar button:active{opacity:.7}
.bar button:disabled{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.show{display:flex}
.box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:380px}
.box h2{margin:0 0 12px;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px}
.seg{display:flex;gap:6px}
.seg button{background:#0f1a14;color:var(--t);border:2px solid transparent;border-radius:10px;padding:8px 12px;font-size:15px;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--w);color:var(--w)}
.big{width:100%;background:var(--w);color:#222;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;font-family:inherit;margin-top:8px;cursor:pointer}
.ghost{background:transparent;color:var(--m);font-weight:500}
.win{text-align:center}.win .t{font-size:44px}
</style>
</head>
<body>
<div class="app">
  <div class="call"><button class="lang" id="lang">EN</button><small id="callLbl">&nbsp;</small><b id="call">0-0-2</b></div>
  <div class="teams">
    <button class="team a" id="tA"><div class="srv" id="sA"></div><input id="nA" value="" maxlength="14"><div class="score" id="pA">0</div><div class="games" id="gA"></div><div class="hint" id="hA"></div></button>
    <button class="team b" id="tB"><div class="srv" id="sB"></div><input id="nB" value="" maxlength="14"><div class="score" id="pB">0</div><div class="games" id="gB"></div><div class="hint" id="hB"></div></button>
  </div>
  <button class="fault" id="fault" data-t="fault"></button>
  <div class="bar">
    <button id="undo" data-t="undo"></button>
    <button id="reset" data-t="reset"></button>
    <button id="set" data-t="set"></button>
  </div>
</div>

<div class="modal" id="mSet"><div class="box">
  <h2 data-t="setTitle"></h2>
  <div class="row"><span data-t="mode"></span><div class="seg" id="sgMode"><button data-v="doubles" data-t="doubles"></button><button data-v="singles" data-t="singles"></button></div></div>
  <div class="row"><span data-t="to"></span><div class="seg" id="sgTarget"><button data-v="11">11</button><button data-v="15">15</button><button data-v="21">21</button></div></div>
  <div class="row"><span data-t="win2"></span><div class="seg" id="sgWin"><button data-v="1" data-t="yes"></button><button data-v="0" data-t="no"></button></div></div>
  <div class="row"><span data-t="first"></span><div class="seg" id="sgFirst"><button data-v="0">A</button><button data-v="1">B</button></div></div>
  <div class="row"><span data-t="startNum"></span><div class="seg" id="sgNum"><button data-v="1" data-t="n1"></button><button data-v="2" data-t="n2"></button></div></div>
  <button class="big" id="apply" data-t="apply"></button>
  <button class="big ghost" id="closeSet" data-t="close"></button>
</div></div>

<div class="modal" id="mWin"><div class="box win">
  <div class="t">🏆</div><h2 id="wName"></h2><div id="wScore" style="color:var(--m);margin-bottom:6px"></div>
  <button class="big" id="next" data-t="next"></button>
  <button class="big ghost" id="undo2" data-t="undo2"></button>
</div></div>

<script>
const $=id=>document.getElementById(id);
let cfg={mode:'doubles',target:11,win2:1,first:0,startNum:2};
const T={
th:{fault:'❌ เสิร์ฟเสีย / เบรคเสิร์ฟ',undo:'↩ ย้อนกลับ',reset:'เกมใหม่',set:'⚙ ตั้งค่า',setTitle:'ตั้งค่า',mode:'รูปแบบ',doubles:'คู่',singles:'เดี่ยว',to:'เล่นถึง',win2:'ชนะต้องห่าง 2 แต้ม',yes:'ใช่',no:'ไม่',first:'ทีมเสิร์ฟก่อน',startNum:'เริ่มที่คนเสิร์ฟ',n1:'คนที่ 1',n2:'คนที่ 2 (ทางการ)',apply:'เริ่มเกมใหม่ด้วยค่านี้',close:'ปิด',next:'เกมต่อไป',undo2:'ย้อนแต้มสุดท้าย',
  team:'ทีม',wins:n=>n+' ชนะ!',callS:'ประกาศ (เสิร์ฟ-รับ',callD:'-คนเสิร์ฟ',serve:'เสิร์ฟ',srvNum:' คนที่ ',side:'ฝั่ง',right:'ขวา',left:'ซ้าย',tapPt:'แตะ = ได้แต้ม',recv:'ทีมรับ',gw:n=>'ชนะ '+n+' เกม',conf:'เริ่มเกมใหม่? แต้มปัจจุบันจะหายไป',other:'EN'},
en:{fault:'❌ Fault / Side out',undo:'↩ Undo',reset:'New game',set:'⚙ Settings',setTitle:'Settings',mode:'Format',doubles:'Doubles',singles:'Singles',to:'Play to',win2:'Win by 2',yes:'Yes',no:'No',first:'First serve',startNum:'Start at server',n1:'Server 1',n2:'Server 2 (official)',apply:'Start new game with these',close:'Close',next:'Next game',undo2:'Undo last point',
  team:'Team',wins:n=>n+' wins!',callS:'Call (server-receiver',callD:'-server no.',serve:'Serving',srvNum:' · Server ',side:'',right:'right side',left:'left side',tapPt:'Tap = point',recv:'Receiving',gw:n=>n+' game'+(n===1?'':'s')+' won',conf:'Start a new game? Current score will be lost.',other:'TH'}};
let lang='th';try{lang=localStorage.getItem('pblang')||((navigator.language||'').toLowerCase().startsWith('th')?'th':'en')}catch(e){}
const L=()=>T[lang];
let S, hist=[], games=[0,0], names=['',''];
const isDef=n=>!n||n==='ทีม A'||n==='ทีม B'||n==='Team A'||n==='Team B';
function nm(i){return isDef(names[i])?L().team+' '+'AB'[i]:names[i]}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=L()[el.dataset.t]});
  $('lang').textContent=L().other;
}
function fresh(){return{p:[0,0],srv:cfg.first,num:cfg.mode==='doubles'?(cfg.startNum||2):1,over:false}}
function save(){try{localStorage.setItem('pb2',JSON.stringify({cfg,S,hist,games,names}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('pb2'));if(d){cfg=d.cfg;S=d.S;hist=d.hist;games=d.games;names=d.names;return}}catch(e){}S=fresh()}
function snap(){hist.push(JSON.stringify({S,games}));if(hist.length>200)hist.shift()}
function checkWin(){
  const [a,b]=S.p,m=Math.max(a,b),lead=Math.abs(a-b);
  if(m>=cfg.target&&(!cfg.win2||lead>=2)){S.over=true;return a>b?0:1}
  return -1;
}
function tap(team){
  if(S.over)return;
  if(team!==S.srv)return; // เฉพาะทีมเสิร์ฟที่ได้แต้ม
  snap();
  S.p[team]++;
  const w=checkWin();
  if(w>=0){games[w]++;showWin(w)}
  render();save();
}
function fault(){
  if(S.over)return;
  snap();
  if(cfg.mode==='doubles'&&S.num===1){S.num=2}      // คนที่ 1 เสีย -> คนที่ 2 (ทีมเดิม)
  else{S.srv=1-S.srv;S.num=1}                        // คนที่ 2 เสีย -> อีกทีม เริ่มคนที่ 1
  render();save();
}
$('fault').onclick=fault;
function showWin(w){
  $('wName').textContent=L().wins(nm(w));
  $('wScore').textContent=S.p[0]+' - '+S.p[1];
  $('mWin').classList.add('show');
}
function undo(){
  if(!hist.length)return;
  const h=JSON.parse(hist.pop());S=h.S;games=h.games;
  $('mWin').classList.remove('show');render();save();
}
function render(){
  $('pA').textContent=S.p[0];$('pB').textContent=S.p[1];
  const s=S.srv,r=1-s;
  const call=cfg.mode==='doubles'?`${S.p[s]}-${S.p[r]}-${S.num}`:`${S.p[s]}-${S.p[r]}`;
  $('call').textContent=call;
  $('callLbl').textContent=L().callS+(cfg.mode==='doubles'?L().callD:'')+')';
  ['A','B'].forEach((k,i)=>{
    const isS=i===s;
    $('s'+k).innerHTML=isS?`<span class="badge">🏓 ${L().serve}${cfg.mode==='doubles'?L().srvNum+S.num:''} · ${L().side}${S.p[i]%2===0?L().right:L().left}</span>`:'';
    $('h'+k).textContent=isS?L().tapPt:L().recv;
    $('g'+k).textContent=L().gw(games[i]);
    $('n'+k).value=nm(i);
  });
  $('undo').disabled=!hist.length;
}
$('tA').onclick=e=>{if(e.target.tagName!=='INPUT')tap(0)};
$('tB').onclick=e=>{if(e.target.tagName!=='INPUT')tap(1)};
$('nA').oninput=e=>{names[0]=e.target.value;save()};
$('lang').onclick=()=>{lang=lang==='th'?'en':'th';try{localStorage.setItem('pblang',lang)}catch(e){}applyLang();render()};
$('nB').oninput=e=>{names[1]=e.target.value;save()};
$('undo').onclick=undo;$('undo2').onclick=undo;
$('reset').onclick=()=>{if(S.p[0]+S.p[1]===0||confirm(L().conf)){}else return;newGame()};
function newGame(){S=fresh();hist=[];$('mWin').classList.remove('show');render();save()}
$('next').onclick=()=>{cfg.first=1-cfg.first;newGame()};
function segs(){
  [['sgMode','mode'],['sgTarget','target'],['sgWin','win2'],['sgFirst','first'],['sgNum','startNum']].forEach(([id,k])=>{
    [...$(id).children].forEach(b=>b.classList.toggle('on',String(cfg[k])===b.dataset.v));
  });
}
['sgMode','sgTarget','sgWin','sgFirst','sgNum'].forEach(id=>{
  $(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
    const k={sgMode:'mode',sgTarget:'target',sgWin:'win2',sgFirst:'first',sgNum:'startNum'}[id];
    cfg[k]=k==='mode'?b.dataset.v:+b.dataset.v;segs()};
});
$('set').onclick=()=>{segs();$('mSet').classList.add('show')};
$('closeSet').onclick=()=>$('mSet').classList.remove('show');
$('apply').onclick=()=>{$('mSet').classList.remove('show');games=[0,0];newGame()};
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
load();applyLang();render();
</script>
</body>
</html>
